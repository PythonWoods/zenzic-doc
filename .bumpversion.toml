[tool.bumpversion]
current_version = "0.13.1"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]




[[tool.bumpversion.files]]
filename = "RELEASE.md"
search = "v{current_version}"
replace = "v{new_version}"

[[tool.bumpversion.files]]
filename = "RELEASE.md"
search = '(?m)^(\| Date\s+\|\s+)\d{{4}}-\d{{2}}-\d{{2}}(\s*\|)$'
replace = '| Date     | {now:%Y-%m-%d} |'
regex = true

[[tool.bumpversion.files]]
filename = "docs/how-to/configure-ci-cd.md"
search = 'version:\s*"?v?{current_version}"?'
replace = 'version: "{new_version}"'
regex = true

[[tool.bumpversion.files]]
filename = "docs-it/how-to/configure-ci-cd.md"
search = 'version:\s*"?v?{current_version}"?'
replace = 'version: "{new_version}"'
regex = true

[[tool.bumpversion.files]]
filename = "README.md"
search = "badge/Zenzic-v{current_version}-blue"
replace = "badge/Zenzic-v{new_version}-blue"
