name: docs-ci

on:
  pull_request:
    branches:
      - main
      - 'release/**'
    paths:
      - 'docs/**'
      - 'i18n/**'
      - 'src/**'
      - 'static/**'
      - 'scripts/**'
      - 'docusaurus.config.ts'
      - 'sidebars.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'zenzic.toml'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - main
      - 'release/**'
    paths:
      - 'docs/**'
      - 'i18n/**'
      - 'src/**'
      - 'static/**'
      - 'scripts/**'
      - 'docusaurus.config.ts'
      - 'sidebars.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'zenzic.toml'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Checkout local zenzic (unreleased)
        uses: actions/checkout@v6
        with:
          repository: PythonWoods/zenzic
          ref: release/v0.7.0
          path: _zenzic_core

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install dependencies
        run: npm ci

      - name: Run unified verification
        env:
          ZENZIC_PROJECT_PATH: ./_zenzic_core
        run: just verify
