name: docs-ci

on:
  pull_request:
    branches:
      - main
      - 'release/**'
    paths:
      - 'docs/**'
      - 'i18n/**'
      - 'src/**'
      - 'static/**'
      - 'scripts/**'
      - 'docusaurus.config.ts'
      - 'sidebars.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'zenzic.toml'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - main
      - 'release/**'
    paths:
      - 'docs/**'
      - 'i18n/**'
      - 'src/**'
      - 'static/**'
      - 'scripts/**'
      - 'docusaurus.config.ts'
      - 'sidebars.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'zenzic.toml'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Node 24)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build documentation
        run: npm run build

  sentinel:
    name: Zenzic Sentinel Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Zenzic Documentation Audit
        # Use the release branch directly so D117 pathname:/// support is active
        # without waiting for a PyPI publish. Mirrors local pre-commit Scenario A
        # (uv run --project ../zenzic) but via git URL for CI isolation.
        # TODO: switch to `uses: PythonWoods/zenzic-action@v1` after v0.7.0 publishes.
        run: >-
          uvx --from "git+https://github.com/PythonWoods/zenzic.git@release/v0.7.0"
          zenzic check all --engine docusaurus --strict
