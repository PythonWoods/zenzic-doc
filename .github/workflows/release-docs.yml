name: release-docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

concurrency:
  group: release-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish docs artifact
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build docs
        run: npm run build

      - name: Set artifact name
        id: vars
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=docs-build-${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=docs-build-run-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive build output
        run: tar -czf "${{ steps.vars.outputs.name }}.tar.gz" build

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.vars.outputs.name }}
          path: ${{ steps.vars.outputs.name }}.tar.gz
          retention-days: 30

      - name: Publish GitHub release (tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          files: ${{ steps.vars.outputs.name }}.tar.gz
          generate_release_notes: true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=zenzic-doc
