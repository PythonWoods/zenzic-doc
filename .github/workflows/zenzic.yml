name: Zenzic Docs Quality Gate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  quality-gate:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Run Zenzic Quality Gate
        uses: PythonWoods/zenzic-action@8ed2c150e065889a7ad8fc4d04ea83809b81d9c1 # v2.1.1
        with:
          version: "0.14.1"
          strict: 'true'
          upload-sarif: 'true'
