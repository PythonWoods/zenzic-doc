# ── Dogfooding Enforcement ─────────────────────────────────────────
# Zenzic guards its own documentation.  No commit enters zenzic-doc
# without passing the Zenzic Check.
# ───────────────────────────────────────────────────────────────────

# Segregate stage execution: linters run at commit-time only.
# The just-verify Final Guard runs at push-time only (stages: [pre-push]).
default_stages: [pre-commit]

repos:
  # 1. Generic file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.mdx$
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending

  # 2. TypeScript type checking
  - repo: local
    hooks:
      - id: typecheck
        name: "TypeScript Typecheck"
        entry: npm run typecheck
        language: system
        pass_filenames: false
        types_or: [ts, tsx]

  # 3. ESLint — catches unused disable directives, React/hooks violations
  - repo: local
    hooks:
      - id: eslint
        name: "ESLint"
        entry: npm run lint:ts
        language: system
        pass_filenames: false
        types_or: [ts, tsx]

  # 4. Zenzic Check — ZRT-010 Sovereign Parity: entry-point is 'just check'
  #    so local and CI always run the same guard-aware invocation.
  #    always_run: true — config/nav changes can break docs even without .md edits
  - repo: local
    hooks:
      - id: zenzic-check
        name: 🔍 Zenzic Check (docs-portal audit)
        entry: just check
        language: system
        pass_filenames: false
        always_run: true

  # 5. REUSE/SPDX license compliance
  - repo: https://github.com/fsfe/reuse-tool
    rev: 9fabf9eb815a57aac116b435e8346c200cdb8604  # v6.2.0
    hooks:
      - id: reuse

  # 6. Score badge stamper (pre-commit) — writes current DQS score to badge files.
  # If badges change, pre-commit fails and the developer re-adds + recommits.
  # This ensures badges are always current before any push.
  - repo: local
    hooks:
      - id: just-score-stamp
        name: 🏅 Zenzic Score Badge (stamp)
        entry: just score --stamp --no-header
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

  # 7. Pre-push Final Guard (lifecycle gate model)
  # Single entry-point: locale ≡ remote. Same `just verify` runs in GHA.
  # --stamp runs at pre-commit time (hook above); this gate is read-only (--check-stamp).
  # Install with: uvx pre-commit install -t pre-push
  - repo: local
    hooks:
      - id: just-verify
        name: 🛡️ Zenzic-Doc Final Guard (just verify)
        entry: just verify
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
