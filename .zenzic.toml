strict = true
fail_under = 96

excluded_external_urls = [
    "https://reuse.software/spec/",
    "https://spdx.org/licenses/",
    "https://github.com/settings/tokens",
    "https://github.com/PythonWoods/zenzic",
    "https://github.com/PythonWoods/zenzic-action",
    "https://github.com/PythonWoods/zenzic-doc",
    "https://developers.facebook.com/tools/debug/",
    "https://zenzic.dev/assets/brand/zenzic-brand-system.html",
]

placeholder_patterns = []
placeholder_max_words = 0

[build_context]
engine         = "zensical"
base_url       = "/"
default_locale = "en"
locales        = []

[project_metadata]
release_name = "Magnetite"
badge_stamp_files = ["README.md"]

[governance]
suppression_cap = 20
suppression_cap_fail_hard = true
brand_obsolescence = ["Basalt", "Quartz", "Obsidian", "Graphite"]

[governance.per_file_ignores]
"docs/assets/brand/svg/zenzic-icon.svg"    = ["Z405"]  # Referenced by Jinja2 hero template, invisible to Zenzic static analysis
"docs/tutorials/examples/z1xx-links/z107-circular-anchor.md" = ["Z107"]



[governance.directory_policies]
"docs/assets/**"                  = ["Z402"]
"docs/blog/**"                    = ["Z601", "Z602", "Z503", "Z907"]  # Blog posts are EN-only; Z503 exempted (intentionally invalid snippets used as counter-examples)
"docs/explanation/mineral-path.md"    = ["Z601"]
"docs/tutorials/examples/**"      = ["Z401", "Z506"]
"docs/developers/how-to/contribute/**" = ["Z107"]

[network]
cache_ttl_hours = 24
