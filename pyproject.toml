# pyproject.toml — zenzic-doc build toolchain
# Versioning Law: zenzic-doc MUST share the exact same SemVer as Zenzic Core.
# Version bumps are Human-Only (SDLC boundary). Do NOT modify version autonomously.

[project]
name = "zenzic-doc"
version = "0.12.0"
description = "Documentation for Zenzic Quality Gate"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "zensical",
    "mkdocs-redirects",
]

[tool.uv]
# uv is the standard package manager for this project.
# Install: curl -LsSf https://astral.sh/uv/install.sh | sh
# Sync deps: uv sync

[tool.bumpversion]
# Keeps version in sync with Zenzic Core (Versioning Law).
# Managed via: just release patch|minor|major
current_version = "0.12.0"
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
