  {"Spiegazioni" = ["developers/explanation/adapter-internals.md", "developers/explanation/adr-agnostic-universalism.md", "developers/explanation/adr-bilingual-structural.md", "developers/explanation/adr-decentralized-cli.md", "developers/explanation/adr-discovery.md", "developers/explanation/adr-lint-source.md", "developers/explanation/adr-native-telemetry.md", "developers/explanation/adr-parallel-early-termination.md", "developers/explanation/adr-path-sovereignty.md", "developers/explanation/adr-regex-acl.md", "developers/explanation/adr-unified-perimeter.md", "developers/explanation/adr-vault.md", "developers/explanation/core-laws.md", "developers/explanation/mdx-asset-rationale.md", "developers/explanation/sovereign-verification-model.md", {"Governance" = ["developers/explanation/governance/index.md", "developers/explanation/governance/evolution_policy.md", "developers/explanation/governance/exit_strategy.md", "developers/explanation/governance/licensing.md", "developers/explanation/governance/technical-debt.md"]}]},
]

[[project.nav]]
"Blog" = ["blog/index.md"]

[project.theme]
custom_dir = "overrides"
palette    = [
  { scheme = "slate", primary = "black", accent = "indigo" }
]
features   = [
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.breadcrumbs",
  "navigation.path",
  "navigation.top",
  "toc.follow",
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
]

[extra]
zenzic_version = "0.13.2"


[[extra.alternate]]
name = "English"
link = "/"
lang = "en"

[[extra.alternate]]
name = "Italiano"
link = "/it/"
lang = "it"


[markdown_extensions]
attr_list   = true
tables      = true
admonition  = true

[markdown_extensions.toc]
permalink = true

[markdown_extensions.pymdownx_superfences]
enabled = true

[markdown_extensions.pymdownx_highlight]
anchor_linenums = true

[plugins]
search = {}
# Legacy Docusaurus IT redirects now handled by Cloudflare Pages _redirects file
# (true HTTP 301s at the edge, not client-side meta-refresh).
