[[project.nav]]
"Blog" = ["blog/index.md", {"Posts" = ["blog/posts/2026-04-28-welcome.md", "blog/posts/2026-04-29-tutorial-stop-broken-links.md", "blog/posts/2026-05-24-engineering-v080-deep-dive.md", "blog/posts/2026-05-24-log-v080.md", "blog/posts/2026-05-24-v080-namespace-contract.md", "blog/posts/2026-05-25-dqs-mathematical-model.md", "blog/posts/2026-05-27-terminal-ux-documentation-governance.md", "blog/posts/2026-05-28-enterprise-use-cases.md", "blog/posts/2026-05-30-log-v090.md", "blog/posts/2026-06-03-algorithmic-complexity-and-redos-prevention.md", "blog/posts/2026-06-06-native-ci-integration-and-progressive-adoption.md", "blog/posts/2026-06-09-auditing-the-auditors.md", "blog/posts/2026-06-13-why-we-dropped-docusaurus.md", "blog/posts/2026-06-20-tailwind-mkdocs-material-bridge.md"]}]

[project.theme]
custom_dir = "overrides"
palette    = [
  { scheme = "slate", primary = "black", accent = "indigo", toggle = { icon = "material/brightness-4", name = "Switch to light mode" } },
  { scheme = "default", primary = "indigo", accent = "indigo", toggle = { icon = "material/brightness-7", name = "Switch to dark mode" } }
]
features   = [
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.breadcrumbs",
  "navigation.path",
  "navigation.top",
  "toc.follow",
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
]

[extra]
# ADR-037: No hardcoded SemVer in any .html or .md source.
# CI pipeline passes the current version at build time, e.g.:
#   uvx zensical build -f zensical.toml --extra zenzic_version=0.11.0
zenzic_version = "0.13.2"


[[extra.alternate]]
name = "English"
link = "/"
lang = "en"

[[extra.alternate]]
name = "Italiano"
link = "/it/"
lang = "it"

[markdown_extensions]
attr_list   = true
tables      = true
admonition  = true

[markdown_extensions.toc]
permalink = true

[markdown_extensions.pymdownx_superfences]
enabled = true

[markdown_extensions.pymdownx_highlight]
anchor_linenums = true

[plugins]
search = {}
# Legacy Docusaurus redirects now handled by Cloudflare Pages _redirects file
# (true HTTP 301s at the edge, not client-side meta-refresh).
