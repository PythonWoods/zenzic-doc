# zensical.toml — English Build Configuration (ADR-020: EN Canonical)
# ADR-037 Compliance: No hardcoded SemVer. Version injected via [extra].
# ADR-020: Parallel Italian build → zensical.it.toml (docs_dir = "docs-it")

[project]
site_name   = "Zenzic — Documentation Quality Gate"
site_url    = "https://zenzic.dev/"
docs_dir    = "docs"
site_dir    = "site"
language    = "en"
repo_url    = "https://github.com/PythonWoods/zenzic"
repo_name   = "PythonWoods/zenzic"

extra_css = [
  "assets/css/zenzic-tailwind.min.css",
  "assets/css/extra.css",
  # EXTERNAL BUILD ARTIFACT — compiled by human-run Tailwind CLI (no Node.js in CI).
  # Preflight (CSS Reset) is DISABLED in this file to prevent interference with
  # Zensical base typography. See docs/assets/css/README.md for the build protocol.
]

# --- Navigation (4 tabs: Home / User Documentation / Developer Documentation / Blog)
# Each [[project.nav]] entry is one top-level nav item → one tab (navigation.tabs).
# All pages are listed explicitly (Zensical does NOT auto-expand directory paths).


[[project.nav]]
"Home" = "index.md"

[[project.nav]]
# Each subsection is a single-line inline table (TOML 1.0 constraint).
# The outer array may span multiple lines; inner {Key = [...]} must be one line each.
