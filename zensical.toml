"Developer Documentation" = [
  "developers/index.md",
  {"How-to" = [{"Contribute" = ["developers/how-to/contribute/index.md", "developers/how-to/contribute/pull-requests.md", "developers/how-to/contribute/report-a-bug.md", "developers/how-to/contribute/report-a-docs-issue.md", "developers/how-to/contribute/request-a-change.md"]}, "developers/how-to/implement-adapter.md", "developers/how-to/release-governance-protocol.md", "developers/how-to/write-a-check.md", "developers/how-to/write-plugin.md"]},
