[project.theme]
custom_dir = "overrides"
palette    = [
  { scheme = "slate", primary = "black", accent = "indigo" }
]
features   = [
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.breadcrumbs",
  "navigation.path",
  "navigation.top",
  "toc.follow",
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
]

[extra]
# ADR-037: No hardcoded SemVer in any .html or .md source.
# CI pipeline passes the current version at build time, e.g.:
#   uvx zensical build -f zensical.toml --extra zenzic_version=0.11.0
zenzic_version = "current"

[markdown_extensions]
attr_list   = true
tables      = true
admonition  = true

[markdown_extensions.toc]
permalink = true

[markdown_extensions.pymdownx_superfences]
enabled = true

[markdown_extensions.pymdownx_highlight]
anchor_linenums = true

[plugins]
search = {}

