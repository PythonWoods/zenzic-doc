#
# 🏛️ LOCAL SOVEREIGNTY: keep workstation-only overrides and secrets in
# `.zenzic.local.toml` (git-ignored). Shared `zenzic.toml` is team policy only.

# --- CORE SETTINGS ---
docs_dir   = "docs"
fail_under = 100
strict     = true

# --- PERIMETER GUARD ---
# System directories (node_modules, .git, .venv, build, dist, …) and VCS
# ignore patterns are handled natively by L1/L4 of the exclusion hierarchy.
# No explicit excluded_dirs needed — Zero-Config (v0.7.0+).

# --- EXTERNAL VALIDATION ---
excluded_external_urls = [
    "https://docs.github.com/en/authentication/managing-commit-signature-verification/",
    # zenzic-action is being made public with the v0.7.0 GA release.
    # Remove this exclusion immediately after the repo is set to public.
    "https://github.com/PythonWoods/zenzic-action",
]

# --- PROTEZIONE DOGFOODING ---
# Placeholder checks disabled: the documentation explains placeholder patterns
# by example, so the checker would produce false positives on pages that
# describe its own rules.
placeholder_patterns  = []
placeholder_max_words = 0

# --- ENGINE CONTEXT (DOCS) ---
# Zero-Config (v0.7.0+):
#   * `_category_.json` is auto-shielded by DocusaurusAdapter.get_metadata_files()
#     — no need to declare it under [excluded_assets].
#   * Multi-instance plugin URL prefixes (`/docs/`, `/developers/`) are
#     auto-detected by DocusaurusAdapter.get_absolute_url_prefixes()
#     — no need to declare them under [link_validation].
[build_context]
engine         = "docusaurus"
base_url       = "/"
default_locale = "en"
locales        = ["it"]

# --- BRAND INTEGRITY ---
# Detect deprecated brand terms in documentation source (Z601).
# ADR files contain intentional historical references — excluded by pattern.
# Use [HISTORICAL] inline to suppress intentional references in other files.
[project_metadata]
release_name = "Basalt"

[governance]
# Suppression CAP (ADR-061): allowance of governance-approved exemptions.
# Suppressions up to this value do not reduce score. Only excess deducts points.
# Run 'zenzic explain ZXXX' to see the exact penalty for any rule.
suppression_cap = 49
suppression_cap_fail_hard = true

# Per-file suppression map: silence a rule for specific file globs.
# WARNING: Every entry increases your Technical Debt Score (see formula above).
# Use 'zenzic check --audit' to see all findings including suppressed ones.


# Permanent vocabulary guardian: Z601 BRAND_OBSOLESCENCE fires if any of these
# theatrical brand terms reappear in documentation source.
# CHANGELOG*.md is excluded by default (historical prose allowed).
# Use [HISTORICAL] inline to suppress intentional references in other files.
brand_obsolescence = [
    "Sentinel",
    "Blood Sentinel",
    "Shield",
    "Epoch",
    "Forge",
    "Red Team",
    "Operation",
    "Quartz",
    "Obsidian",
    "ObsidianUI",
    "Safe Harbor",
    "Porto Sicuro",
    "Basalt",
    "Chronicles",
    "Siege",
]
i18n_parity = true

# --- Z602 I18N PARITY (EPOCH 5) ---
# Language-agnostic translation parity gate. Adding ES/FR/JA = edit YAML, no code change.
# Multi-instance: /docs/* (User) + /developers/* (Dev) declared via extra_sources.
[i18n]
enabled = true
base_lang = "en"
base_source = "docs"
strict_parity = true
require_frontmatter_parity = ["title", "description"]

[i18n.targets]
it = "i18n/it/docusaurus-plugin-content-docs/current"

[[i18n.extra_sources]]
base_source = "developers"

[i18n.extra_sources.targets]
it = "i18n/it/docusaurus-plugin-content-docs-developers/current"
